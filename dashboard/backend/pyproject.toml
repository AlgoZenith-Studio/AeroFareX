[project]
name = "aerofarex-core"
version = "0.1.0"
description = "AeroFareX backend service: analyst API, index engine, publication scheduler (TRD Part A/H)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "apscheduler>=3.10,<4",
    "firebase-admin>=6.6",
    "tzdata>=2024.1",  # IANA zones on Windows (Asia/Kolkata)
    "aerofarex-public-api",
]

[project.scripts]
aerofarex = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
