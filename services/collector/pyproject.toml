[project]
name = "aerofarex-collector"
version = "0.1.0"
description = "AeroFareX collector: declared, rate-limited fare collection (TRD Part A, decision D6/D7)"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "pydantic>=2.9",
    "aerofarex-core",
]

[project.optional-dependencies]
# Firebase Storage raw archive + Firestore health (needs a service-account key).
firebase = ["firebase-admin>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]
